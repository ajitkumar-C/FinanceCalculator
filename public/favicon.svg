<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="brand-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Gradient Background -->
  <rect width="32" height="32" rx="8" fill="url(#brand-grad)" />
  
  <!-- White Calculator Icon -->
  <rect x="8" y="6" width="16" height="20" rx="2" ry="2" stroke="white" stroke-width="2" fill="none" />
  
  <!-- Calculator Screen -->
  <line x1="11" y1="10" x2="21" y2="10" stroke="white" stroke-width="2" stroke-linecap="round" />
  
  <!-- Keypad Buttons -->
  <circle cx="11.5" cy="15.5" r="1" fill="white" />
  <circle cx="16" cy="15.5" r="1" fill="white" />
  <circle cx="20.5" cy="15.5" r="1" fill="white" />
  
  <circle cx="11.5" cy="19.5" r="1" fill="white" />
  <circle cx="16" cy="19.5" r="1" fill="white" />
  <circle cx="20.5" cy="19.5" r="1" fill="white" />
  
  <circle cx="11.5" cy="23.5" r="1" fill="white" />
  <circle cx="16" cy="23.5" r="1" fill="white" />
  <circle cx="20.5" cy="23.5" r="1" fill="white" />
</svg>